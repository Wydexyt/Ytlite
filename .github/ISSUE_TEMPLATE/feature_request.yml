name: Предложение
description: Идея новой функции или улучшения
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что добавить или изменить
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно
      description: В какой ситуации пригодится
