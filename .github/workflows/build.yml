name: Build APK

on:
  push:
    branches: [main, dev]
    # изменения только в документации не собирают новую версию
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Секрет KEYSTORE_B64 не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > app/release.jks

      - name: Version
        run: |
          base=$(grep '^version=' version.properties | cut -d= -f2 | tr -d ' \r')
          if git rev-parse -q --verify "refs/tags/v${base}" >/dev/null; then
            # Версия уже выпущена — это хотфикс: base.N
            n=$(git tag -l "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
            VERSION="${base}.$(( ${n:-0} + 1 ))"
          else
            VERSION="${base}"
          fi
          [ "${GITHUB_REF}" = "refs/heads/main" ] || VERSION="${VERSION}-dev${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Версия: ${VERSION}"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ env.VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "YTLite-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: YTLite-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Описание релиза — раздел CHANGELOG.md "## <версия>"; иначе — сообщение коммита
          awk -v ver="## ${VERSION} " '
            /^## / { if (found) exit; if (index($0, ver) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || git log -1 --pretty=%s > notes.md
          printf '\n---\nУстановка: скачайте APK ниже и установите поверх предыдущей версии.\n' >> notes.md
          gh release create "v${VERSION}" "YTLite-${VERSION}.apk" \
            --title "YT Lite ${VERSION}" \
            --notes-file notes.md
