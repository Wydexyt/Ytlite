name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Секрет KEYSTORE_B64 не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > app/release.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "YTLite-v${BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: YTLite-v*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "v${BUILD_NUMBER}" "YTLite-v${BUILD_NUMBER}.apk" \
            --title "YT Lite v${BUILD_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)"
